[project]
name = "mindbliss-voice-agent"
version = "0.1.0"
description = "Pipecat voice bridge for Mindbliss support calls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "python-dotenv>=1,<2",
    "pipecat-ai[runner,websocket,webrtc,openrouter,openai,silero,deepgram,cartesia]>=1.4.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
