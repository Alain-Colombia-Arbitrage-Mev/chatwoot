services:
  mindbliss-support-agent:
    build:
      context: ./mindbliss-support-agent
    image: mindblisspower/chatwoot-support-agent:latest
    restart: always
    env_file:
      - .env.mindbliss-support-agent
    environment:
      NODE_ENV: production
      PORT: "9108"
      CHATWOOT_BASE_URL: http://rails:3000
    networks:
      - default
      - mindbliss-ai-memory
    ports:
      - "127.0.0.1:9108:9108"
    depends_on:
      - rails
      - sidekiq
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9108/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mindbliss-voice-gateway:
    build:
      context: ./mindbliss-voice-agent
    image: mindblisspower/chatwoot-voice-agent:latest
    restart: always
    command: ["uvicorn", "voice_agent.gateway:app", "--host", "0.0.0.0", "--port", "9110", "--no-access-log"]
    env_file:
      - .env.mindbliss-voice-agent
    environment:
      VOICE_GATEWAY_PORT: "9110"
      PIPECAT_RUNNER_URL: http://mindbliss-voice-pipecat:9111
    networks:
      - default
      - mindbliss-ai-memory
    ports:
      - "127.0.0.1:9110:9110"
    depends_on:
      - mindbliss-voice-pipecat
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9110/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mindbliss-voice-pipecat:
    build:
      context: ./mindbliss-voice-agent
    image: mindblisspower/chatwoot-voice-agent:latest
    restart: always
    command: ["python", "-m", "voice_agent.run_pipecat"]
    env_file:
      - .env.mindbliss-voice-agent
    environment:
      PIPECAT_HOST: 0.0.0.0
      PIPECAT_PORT: "9111"
      PIPECAT_WEBSOCKET_AUTH: token
    networks:
      - default
      - mindbliss-ai-memory
    ports:
      - "127.0.0.1:9111:9111"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9111/status', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mindbliss-ai-memory:
    external: true
    name: ai-memory_default
