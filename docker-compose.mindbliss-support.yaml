services:
  mindbliss-qdrant:
    image: ${MINDBLISS_QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: always
    volumes:
      - mindbliss_qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  mindbliss-falkordb:
    image: ${MINDBLISS_FALKORDB_IMAGE:-falkordb/falkordb:latest}
    restart: always
    volumes:
      - mindbliss_falkordb_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  mindbliss-support-agent:
    build:
      context: ./mindbliss-support-agent
    image: mindblisspower/chatwoot-support-agent:latest
    restart: always
    env_file:
      - .env.mindbliss-support-agent
    environment:
      NODE_ENV: production
      PORT: "9108"
      CHATWOOT_BASE_URL: http://rails:3000
      QDRANT_URL: http://mindbliss-qdrant:6333
      FALKORDB_URL: redis://mindbliss-falkordb:6379
    ports:
      - "127.0.0.1:9108:9108"
    depends_on:
      - rails
      - sidekiq
      - mindbliss-qdrant
      - mindbliss-falkordb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9108/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mindbliss_qdrant_storage:
  mindbliss_falkordb_data:
