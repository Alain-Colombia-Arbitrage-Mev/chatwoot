services:
  mindbliss-support-agent:
    build:
      context: ./mindbliss-support-agent
    image: mindblisspower/chatwoot-support-agent:latest
    restart: always
    env_file:
      - .env.mindbliss-support-agent
    environment:
      NODE_ENV: production
      PORT: "9108"
      CHATWOOT_BASE_URL: http://rails:3000
    networks:
      - default
      - mindbliss-ai-memory
    ports:
      - "127.0.0.1:9108:9108"
    depends_on:
      - rails
      - sidekiq
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9108/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  mindbliss-ai-memory:
    external: true
    name: ai-memory_default
